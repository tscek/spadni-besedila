name: Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          # Predpomnilnik na Windows obvisi pri razpakiranju, zato brez njega.
          cache: false

      - run: flutter pub get

      # Spletna različica v aplikaciji: računalnik kot vodja na špilu jo streže iPadom.
      - name: Spletna različica za vodjo
        shell: bash
        run: |
          rm -f assets/splet/splet.zip
          flutter build web --release --no-web-resources-cdn \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          cd build/web
          7z a -tzip -mx=9 ../../assets/splet/splet.zip . \
            '-xr!*.symbols' '-xr!chromium' '-xr!skwasm*' '-xr!wimp*' '-xr!webparagraph' \
            '-x!assets/NOTICES' '-x!sw.js' '-x!assets/assets/splet'
          ls -l ../../assets/splet/splet.zip

      # Prijava z Google na računalniku: odjemalec vrste "Desktop app" (spremenljivka in skrivnost na GitHubu).
      - name: Gradnja
        shell: bash
        run: |
          if [ -z "${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}" ]; then
            echo "::warning::Ni spremenljivke GOOGLE_DESKTOP_CLIENT_ID, prijava na računalniku ne bo delovala."
          fi
          flutter build windows --release --build-number=${{ github.run_number }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }} \
            --dart-define=GOOGLE_DESKTOP_CLIENT_ID=${{ vars.GOOGLE_DESKTOP_CLIENT_ID }} \
            --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}

      - name: Zip
        shell: bash
        run: |
          mv build/windows/x64/runner/Release spadni-besedila
          7z a -tzip "spadni-besedila-windows-${{ github.run_number }}.zip" spadni-besedila

      - uses: actions/upload-artifact@v5
        with:
          name: spadni-besedila-windows-${{ github.run_number }}
          path: spadni-besedila-windows-${{ github.run_number }}.zip

      - name: Objava na strani Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-${{ github.run_number }}
          name: Windows ${{ github.run_number }}
          body: Samodejna gradnja za Windows iz ${{ github.sha }}. Razpakiraj in zaženi spadni_besedila.exe.
          files: spadni-besedila-windows-${{ github.run_number }}.zip

      # Posodobitev v aplikaciji (gumb Posodobi): ZIP gre prek skripte na Drive, tako kot APK za Android.
      - name: Naloži posodobitev na Drive
        shell: bash
        env:
          UPLOAD_KLJUC: ${{ secrets.UPLOAD_KLJUC }}
        run: |
          if [ -z "$UPLOAD_KLJUC" ]; then
            echo "::warning::Ni skrivnosti UPLOAD_KLJUC, posodobitev ni naložena na Drive."
            exit 0
          fi
          url=$(grep -o "https://script.google.com/macros/s/[^']*/exec" lib/config.dart)
          # Majhen poskus najprej: le nova koda skripte pozna Windows in odgovori z "(windows)".
          proba=$(curl -sS -L --max-time 60 -H "Content-Type: text/plain" \
            --data '{"akcija":"naloziApk","kljuc":"preveri","platforma":"windows"}' "$url")
          echo "Preverjanje skripte: $proba"
          if ! echo "$proba" | grep -q "(windows)"; then
            echo "::warning::Skripta še ne pozna posodobitev za Windows. V Apps Scriptu: Deploy > Manage deployments > New version."
            exit 0
          fi
          python - <<'PY'
          import base64, json, os
          n = os.environ['GITHUB_RUN_NUMBER']
          with open(f'spadni-besedila-windows-{n}.zip', 'rb') as f:
              zip_ = base64.b64encode(f.read()).decode()
          telo = {'akcija': 'naloziApk', 'platforma': 'windows', 'kljuc': os.environ['UPLOAD_KLJUC'],
                  'verzija': int(n), 'ime': f'spadni-besedila-windows-{n}.zip', 'base64': zip_}
          with open('telo.json', 'w') as f:
              json.dump(telo, f)
          PY
          echo "Velikost zahteve: $(du -h telo.json | cut -f1)"
          odgovor=$(curl -sS -L --max-time 300 -H "Content-Type: text/plain" --data-binary @telo.json "$url")
          echo "$odgovor" | head -c 300; echo
          echo "$odgovor" | grep -q '"verzija"' || { echo "::error::Nalaganje na Drive ni uspelo"; exit 1; }
