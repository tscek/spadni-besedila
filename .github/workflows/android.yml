name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Podpisni ključ (skrivnosti ANDROID_KEYSTORE_BASE64 in ANDROID_KEYSTORE_PASSWORD).
      # Brez njiju se APK podpiše z debug ključem in Google prijava ne deluje.
      - name: Podpisni ključ
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Ni podpisnega ključa, APK bo podpisan z debug ključem."
          fi

      # Spletna različica v APK-ju: vodja na špilu jo streže iPadom (assets/splet/splet.zip).
      - name: Spletna različica za vodjo
        run: |
          rm -f assets/splet/splet.zip
          flutter build web --release --no-web-resources-cdn \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          (cd build/web && zip -qr -9 ../../assets/splet/splet.zip . \
            -x '*.symbols' 'canvaskit/chromium/*' 'canvaskit/skwasm*' 'canvaskit/wimp*' \
               'canvaskit/webparagraph/*' 'assets/NOTICES' 'sw.js' 'assets/assets/splet/*')
          ls -l assets/splet/splet.zip

      - name: Gradnja APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}

      - name: Ime datoteke
        run: cp build/app/outputs/flutter-apk/app-release.apk "spadni-besedila-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: spadni-besedila-${{ github.run_number }}
          path: spadni-besedila-${{ github.run_number }}.apk

      - name: Objava na strani Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Različica ${{ github.run_number }}
          body: Samodejna gradnja iz ${{ github.sha }}.
          files: spadni-besedila-${{ github.run_number }}.apk

      # Posodobitev v aplikaciji: manjši APK samo za arm64 (vse novejše tablice) gre prek skripte na Drive.
      - name: Naloži posodobitev na Drive
        env:
          UPLOAD_KLJUC: ${{ secrets.UPLOAD_KLJUC }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KLJUC" ]; then
            echo "::warning::Ni skrivnosti UPLOAD_KLJUC, posodobitev ni naložena na Drive."
            exit 0
          fi
          flutter build apk --release --target-platform android-arm64 \
            --build-number=${{ github.run_number }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          python3 - <<'PY'
          import base64, json, os
          with open('build/app/outputs/flutter-apk/app-release.apk', 'rb') as f:
              apk = base64.b64encode(f.read()).decode()
          telo = {'akcija': 'naloziApk', 'kljuc': os.environ['UPLOAD_KLJUC'],
                  'verzija': int(os.environ['GITHUB_RUN_NUMBER']),
                  'ime': f"spadni-besedila-{os.environ['GITHUB_RUN_NUMBER']}.apk", 'base64': apk}
          with open('telo.json', 'w') as f:
              json.dump(telo, f)
          PY
          url=$(grep -o "https://script.google.com/macros/s/[^']*/exec" lib/config.dart)
          # Majhen poskus najprej: nova koda skripte odgovori "Napačen ključ", stara "Manjka prijava".
          proba=$(curl -sS -L --max-time 60 -H "Content-Type: text/plain" --data '{"akcija":"naloziApk","kljuc":"preveri"}' "$url")
          echo "Preverjanje skripte: $proba"
          if echo "$proba" | grep -q "Manjka prijava"; then
            echo "::error::Na naslovu skripte teče stara koda. V Apps Scriptu: Uvedi > Upravljaj uvedbe > svinčnik > Nova različica > Uvedi."
            exit 1
          fi
          echo "Velikost zahteve: $(du -h telo.json | cut -f1)"
          odgovor=$(curl -sS -L --max-time 300 -H "Content-Type: text/plain" --data-binary @telo.json "$url")
          echo "$odgovor" | head -c 300; echo
          echo "$odgovor" | grep -q '"verzija"' || { echo "::error::Nalaganje na Drive ni uspelo"; exit 1; }
