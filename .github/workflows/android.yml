name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Podpisni ključ (skrivnosti ANDROID_KEYSTORE_BASE64 in ANDROID_KEYSTORE_PASSWORD).
      # Brez njiju se APK podpiše z debug ključem in Google prijava ne deluje.
      - name: Podpisni ključ
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Ni podpisnega ključa, APK bo podpisan z debug ključem."
          fi

      - name: Gradnja APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}

      - name: Ime datoteke
        run: cp build/app/outputs/flutter-apk/app-release.apk "spadni-besedila-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: spadni-besedila-${{ github.run_number }}
          path: spadni-besedila-${{ github.run_number }}.apk

      - name: Objava na strani Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Različica ${{ github.run_number }}
          body: Samodejna gradnja iz ${{ github.sha }}.
          files: spadni-besedila-${{ github.run_number }}.apk
