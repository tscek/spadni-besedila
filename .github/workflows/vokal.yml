name: Odstranitev vokala

# Aplikacija (prek skripte, akcija odstraniVokal) zahteva odstranitev vokala iz playbacka pesmi.
# Demucs (htdemucs) na procesorju, nekaj minut na pesem; rezultat gre nazaj k pesmi (tool/vokal/vokal.py).
on:
  repository_dispatch:
    types: [odstrani-vokal]
  workflow_dispatch:
    inputs:
      pesem:
        description: ID pesmi
        required: true

permissions:
  contents: read

concurrency:
  group: vokal-${{ github.event.client_payload.pesem || inputs.pesem }}
  cancel-in-progress: false

jobs:
  vokal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tool/vokal/requirements.txt

      - name: Model Demucs (predpomnilnik)
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: demucs-htdemucs-v1

      - name: Orodja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r tool/vokal/requirements.txt

      - name: Odstrani vokal
        env:
          UPLOAD_KLJUC: ${{ secrets.UPLOAD_KLJUC }}
          PESEM: ${{ github.event.client_payload.pesem || inputs.pesem }}
        run: |
          export API_URL=$(grep -o "https://script.google.com/macros/s/[^']*/exec" lib/config.dart)
          python tool/vokal/vokal.py
